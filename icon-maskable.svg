<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fondo rojo sólido (safe area maskable) -->
  <rect width="512" height="512" fill="#e30613"/>

  <!-- Degradado sutil para profundidad -->
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ff3a3a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b0000" stop-opacity="0.3"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Cruz central (símbolo de iglesia) -->
  <!-- Barra vertical -->
  <rect x="234" y="112" width="44" height="220" rx="8" fill="white" opacity="0.95"/>
  <!-- Barra horizontal -->
  <rect x="166" y="168" width="180" height="44" rx="8" fill="white" opacity="0.95"/>

  <!-- Texto "APOSENTO ALTO" en arco inferior -->
  <!-- Línea separadora -->
  <rect x="120" y="355" width="272" height="2" rx="1" fill="white" opacity="0.4"/>

  <!-- Iniciales "AA" debajo de la cruz -->
  <text
    x="256"
    y="415"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="52"
    font-weight="700"
    fill="white"
    opacity="0.95"
    letter-spacing="8"
  >AA</text>

  <!-- Subtexto "PIEDRA VIVA" -->
  <text
    x="256"
    y="448"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    font-weight="400"
    fill="white"
    opacity="0.70"
    letter-spacing="4"
  >PIEDRA VIVA</text>
</svg>
